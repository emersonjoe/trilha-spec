name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # The whole module, execution/ included: the same command as `make vet`.
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go test -race ./...
  # The execution contract (adr/002) is one fixture copied into every
  # repository. This job checks out the public sibling and compares; it is
  # red until the sibling ships the same fixture, and that red is the point.
  # trilha-cloud is private and is compared only by `make conformance` on a
  # machine that has both checkouts.
  conformance:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trilha-spec
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emersonjoe/trilha-runner
          ref: main
          path: trilha-runner
          persist-credentials: false
      - run: ./scripts/check-execution-contract.sh
        working-directory: trilha-spec
